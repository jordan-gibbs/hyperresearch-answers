# Publishes langchain-hyperresearch to PyPI with trusted publishing when a tag
# langchain-python-v<version> is pushed. Needs a PyPI (pending) trusted publisher
# first: see packages/langchain-python/README.md, "Releasing".
name: publish langchain-python

on:
  push:
    tags:
      - "langchain-python-v*"

permissions:
  contents: read

concurrency:
  group: publish-langchain-python
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/langchain-python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#langchain-python-v}"
          version="$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi
      - run: uv sync --locked --group test
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/langchain-python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
